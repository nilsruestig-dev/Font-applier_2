<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Font Studio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Indie+Flower&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
    .checkerboard {
      background-color: #f8fafc;
      background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

  <header class="bg-white border-b border-slate-200 px-4 py-3 shadow-sm sticky top-0 z-30 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg">F</div>
      <div>
        <h1 class="font-bold text-slate-900 leading-none">Font Studio</h1>
        <p class="text-xs text-slate-500">Samsung Notes Companion</p>
      </div>
    </div>
  </header>

  <main class="flex-1 p-3 flex flex-col max-w-2xl mx-auto w-full">
    <div class="relative w-full rounded-xl overflow-hidden shadow-sm border border-slate-300 bg-white min-h-[360px] flex items-center justify-center checkerboard">
      <canvas id="mainCanvas" class="max-w-full max-h-[60vh] object-contain shadow-md"></canvas>
      
      <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-white/90">
        <svg class="w-12 h-12 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <p class="text-sm font-semibold text-slate-700">Kein Dokument geladen</p>
        <p class="text-xs text-slate-500 mt-1 mb-4 max-w-xs">Teile ein Dokument aus Samsung Notes oder lade ein Bild manuell hoch.</p>
        <label class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-4 py-2 rounded-lg cursor-pointer transition shadow-sm">
          Hintergrund laden
          <input type="file" id="bgInput" accept="image/*,.pdf" class="hidden">
        </label>
      </div>
    </div>

    <div class="mt-3 bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-4">
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Text & Schrift</label>
        <input type="text" id="textInput" value="Eigener Handschrift-Text" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        
        <div class="flex gap-2 pt-1">
          <select id="fontSelect" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-xs bg-white">
            <option value="'Caveat', cursive">Caveat (Standard)</option>
            <option value="'Dancing Script', cursive">Dancing Script</option>
            <option value="'Indie Flower', cursive">Indie Flower</option>
            <option value="custom">Eigener Custom Font (.ttf / .otf)...</option>
          </select>
          
          <label id="customFontLabel" class="hidden bg-slate-100 hover:bg-slate-200 border border-slate-300 px-3 py-2 rounded-lg text-xs font-medium cursor-pointer flex items-center">
            Upload
            <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" class="hidden">
          </label>
        </div>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-100">
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Größe: <span id="sizeVal">36</span>px</label>
          <input type="range" id="sizeRange" min="12" max="100" value="36" class="w-full">
        </div>
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Farbe</label>
          <input type="color" id="colorPicker" value="#1e293b" class="w-full h-8 rounded border border-slate-300 cursor-pointer">
        </div>
        <div class="col-span-2 sm:col-span-1">
          <label class="block text-[11px] font-medium text-slate-500 mb-1">Rotation: <span id="rotVal">0</span>°</label>
          <input type="range" id="rotRange" min="-180" max="180" value="0" class="w-full">
        </div>
      </div>

      <div class="pt-2 border-t border-slate-100 flex flex-col sm:flex-row gap-2">
        <button id="copyBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs py-2.5 rounded-lg flex items-center justify-center gap-2 shadow-sm transition">
          Als transparentes PNG kopieren
        </button>
        <label class="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 font-medium text-xs py-2.5 px-4 rounded-lg flex items-center justify-center cursor-pointer transition">
          Neues Bild
          <input type="file" id="bgInputSecondary" accept="image/*" class="hidden">
        </label>
      </div>
    </div>
  </main>

  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50">
    <span id="toastMsg">In Zwischenablage kopiert!</span>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const emptyState = document.getElementById('emptyState');
    
    let bgImage = null;
    let textState = { text: "Eigener Handschrift-Text", fontFamily: "'Caveat', cursive", size: 36, color: "#1e293b", rotation: 0, x: 0, y: 0 };
    let isDragging = false, dragStart = { x: 0, y: 0 };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
    }

    async function checkSharedData() {
      if ('caches' in window) {
        try {
          const cache = await caches.open('shared-images');
          const response = await cache.match('shared-note');
          if (response) {
            const blob = await response.blob();
            const reader = new FileReader();
            reader.onload = (e) => loadBackgroundImage(e.target.result);
            reader.readAsDataURL(blob);
            await cache.delete('shared-note');
          }
        } catch (e) { console.error(e); }
      }
    }
    window.addEventListener('load', checkSharedData);

    function render() {
      if (!bgImage) { canvas.width = 600; canvas.height = 400; ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
      canvas.width = bgImage.width; canvas.height = bgImage.height;
      ctx.drawImage(bgImage, 0, 0);
      ctx.save();
      ctx.translate(textState.x, textState.y);
      ctx.rotate((textState.rotation * Math.PI) / 180);
      ctx.font = `${textState.size}px ${textState.fontFamily}`;
      ctx.fillStyle = textState.color;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(textState.text, 0, 0);
      ctx.restore();
    }

    function loadBackgroundImage(src) {
      const img = new Image();
      img.onload = () => { bgImage = img; emptyState.classList.add('hidden'); textState.x = img.width / 2; textState.y = img.height / 2; render(); };
      img.src = src;
    }

    document.getElementById('bgInput').addEventListener('change', handleImageUpload);
    document.getElementById('bgInputSecondary').addEventListener('change', handleImageUpload);
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) { const reader = new FileReader(); reader.onload = (event) => loadBackgroundImage(event.target.result); reader.readAsDataURL(file); }
    }

    document.getElementById('textInput').addEventListener('input', (e) => { textState.text = e.target.value; render(); });
    document.getElementById('sizeRange').addEventListener('input', (e) => { textState.size = parseInt(e.target.value); document.getElementById('sizeVal').innerText = e.target.value; render(); });
    document.getElementById('rotRange').addEventListener('input', (e) => { textState.rotation = parseInt(e.target.value); document.getElementById('rotVal').innerText = e.target.value; render(); });
    document.getElementById('colorPicker').addEventListener('input', (e) => { textState.color = e.target.value; render(); });

    const fontSelect = document.getElementById('fontSelect');
    fontSelect.addEventListener('change', (e) => {
      if (e.target.value === 'custom') { document.getElementById('customFontLabel').classList.remove('hidden'); }
      else { document.getElementById('customFontLabel').classList.add('hidden'); textState.fontFamily = e.target.value; render(); }
    });

    document.getElementById('fontFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const font = new FontFace('CustomUserFont', event.target.result);
          font.load().then((loadedFont) => {
            document.fonts.add(loadedFont);
            textState.fontFamily = 'CustomUserFont';
            showToast('Custom Font geladen!');
            render();
          });
        };
        reader.readAsArrayBuffer(file);
      }
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.font = `${textState.size}px ${textState.fontFamily}`;
      const metrics = tempCtx.measureText(textState.text);
      const padding = 20;
      tempCanvas.width = Math.ceil(metrics.width) + padding * 2;
      tempCanvas.height = Math.ceil(textState.size * 1.5) + padding * 2;
      tempCtx.save();
      tempCtx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
      tempCtx.rotate((textState.rotation * Math.PI) / 180);
      tempCtx.font = `${textState.size}px ${textState.fontFamily}`;
      tempCtx.fillStyle = textState.color;
      tempCtx.textAlign = 'center'; tempCtx.textBaseline = 'middle';
      tempCtx.fillText(textState.text, 0, 0);
      tempCtx.restore();

      try {
        tempCanvas.toBlob(async (blob) => {
          if (!blob) return;
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          showToast('In Zwischenablage kopiert!');
        }, 'image/png');
      } catch (err) { showToast('Kopieren fehlgeschlagen.'); }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 3000);
    }

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
    }

    canvas.addEventListener('mousedown', (e) => { isDragging = true; const coords = getCanvasCoords(e); dragStart = { x: coords.x - textState.x, y: coords.y - textState.y }; });
    canvas.addEventListener('mousemove', (e) => { if (isDragging) { const coords = getCanvasCoords(e); textState.x = coords.x - dragStart.x; textState.y = coords.y - dragStart.y; render(); } });
    window.addEventListener('mouseup', () => isDragging = false);
    canvas.addEventListener('touchstart', (e) => { isDragging = true; const coords = getCanvasCoords(e); dragStart = { x: coords.x - textState.x, y: coords.y - textState.y }; });
    canvas.addEventListener('touchmove', (e) => { if (isDragging) { const coords = getCanvasCoords(e); textState.x = coords.x - dragStart.x; textState.y = coords.y - dragStart.y; render(); } });
    window.addEventListener('touchend', () => isDragging = false);

    render();
  </script>
</body>
</html>
